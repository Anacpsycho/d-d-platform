# Podman Pod configuration for D&D 5E Character Sheet Application
apiVersion: v1
kind: Pod
metadata:
  name: dnd-app-pod
  labels:
    app: dnd-character-sheet
spec:
  # Pod-level settings
  restartPolicy: Always
  
  # Shared network namespace for all containers
  hostNetwork: false
  
  containers:
  # MongoDB Database
  - name: mongodb
    image: docker.io/library/mongo:6
    ports:
    - containerPort: 27017
      hostPort: 27017
    env:
    - name: MONGO_INITDB_ROOT_USERNAME
      value: admin
    - name: MONGO_INITDB_ROOT_PASSWORD
      value: changeme123
    - name: MONGO_INITDB_DATABASE
      value: dnd
    volumeMounts:
    - name: mongo-data
      mountPath: /data/db
    resources:
      limits:
        memory: 512Mi
        cpu: "0.5"
      requests:
        memory: 256Mi
        cpu: "0.25"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      startPeriod: 40s

  # Redis Cache
  - name: redis
    image: docker.io/library/redis:7-alpine
    ports:
    - containerPort: 6379
      hostPort: 6379
    command: ["redis-server", "--appendonly", "yes"]
    volumeMounts:
    - name: redis-data
      mountPath: /data
    resources:
      limits:
        memory: 256Mi
        cpu: "0.25"
      requests:
        memory: 128Mi
        cpu: "0.1"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 3s
      retries: 3
      startPeriod: 10s

  # Backend API
  - name: backend
    image: localhost/dnd-backend:latest
    ports:
    - containerPort: 3000
      hostPort: 3000
    env:
    - name: NODE_ENV
      value: production
    - name: PORT
      value: "3000"
    - name: DATABASE_URL
      value: mongodb://admin:changeme123@localhost:27017/dnd?authSource=admin
    - name: JWT_SECRET
      value: your-super-secret-jwt-key-change-in-production
    - name: JWT_EXPIRES_IN
      value: 15m
    - name: REFRESH_TOKEN_EXPIRES_IN
      value: 7d
    - name: REDIS_URL
      value: redis://localhost:6379
    - name: CORS_ORIGIN
      value: http://localhost:80
    - name: GOOGLE_SHEETS_API_KEY
      value: ""
    - name: SRD_API_URL
      value: https://www.dnd5eapi.co/api
    resources:
      limits:
        memory: 1Gi
        cpu: "1"
      requests:
        memory: 512Mi
        cpu: "0.5"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      startPeriod: 40s
    dependsOn:
    - mongodb
    - redis

  # Frontend
  - name: frontend
    image: localhost/dnd-frontend:latest
    ports:
    - containerPort: 8080
      hostPort: 8080
    env:
    - name: VITE_API_URL
      value: http://localhost:3000
    - name: VITE_WS_URL
      value: http://localhost:3000
    resources:
      limits:
        memory: 256Mi
        cpu: "0.25"
      requests:
        memory: 128Mi
        cpu: "0.1"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      startPeriod: 10s
    dependsOn:
    - backend

  # Nginx Reverse Proxy
  - name: nginx
    image: localhost/dnd-nginx:latest
    ports:
    - containerPort: 80
      hostPort: 80
    - containerPort: 443
      hostPort: 443
    resources:
      limits:
        memory: 128Mi
        cpu: "0.25"
      requests:
        memory: 64Mi
        cpu: "0.1"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      startPeriod: 10s
    dependsOn:
    - frontend
    - backend

  # Volumes
  volumes:
  - name: mongo-data
    hostPath:
      path: ./data/mongodb
      type: DirectoryOrCreate
  - name: redis-data
    hostPath:
      path: ./data/redis
      type: DirectoryOrCreate

